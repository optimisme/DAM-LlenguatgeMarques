<!doctype html>
<html lang="ca">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprovació de cursors</title>
<style>
body { margin: 32px; font: 18px/1.5 system-ui; background: white; color: #18233d; }
.area { margin: 20px 0; padding: 40px; border: 2px solid #64748b; background: #edf2f7; }
.area:hover { background: #c5e8d5; }
</style>
<h1>Comprovació independent de cursors</h1>
<p>Cada rectangle ha de mantenir el cursor indicat a tota la seva superfície. El fons es torna verd quan hi passes el ratolí.</p>
<div class="area" style="cursor: crosshair">crosshair — creu de precisió</div>
<div class="area" style="cursor: pointer">pointer — mà</div>
<div class="area" style="cursor: none">none — sense cursor</div>
<div class="area" style="cursor: text">text — cursor de text</div>
</html>
