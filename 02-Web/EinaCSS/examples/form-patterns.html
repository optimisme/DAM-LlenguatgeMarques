<form class="ex-form-patterns" aria-labelledby="form-patterns-title"><h2 id="form-patterns-title">Validació amb patrons</h2><div class="camp"><label for="patterns-user">Usuari: de 3 a 12 lletres o números</label><input id="patterns-user" name="usuari" pattern="[A-Za-z0-9]{3,12}" placeholder="alumne01" required aria-describedby="patterns-user-error"><small class="error" id="patterns-user-error">Entre 3 i 12 caràcters, només lletres sense accents i números.</small></div><div class="camp"><label for="patterns-phone">Telèfon: exactament 9 dígits</label><input type="tel" id="patterns-phone" name="telefon" pattern="[0-9]{9}" placeholder="600123456" required aria-describedby="patterns-phone-error"><small class="error" id="patterns-phone-error">Escriu 9 dígits sense espais.</small></div><div class="camp"><label for="patterns-name">Nom: de 3 a 20 lletres o espais</label><input id="patterns-name" name="nom" pattern="[A-Za-zÀ-ÖØ-öø-ÿ ]{3,20}" placeholder="Anna Maria" required aria-describedby="patterns-name-error"><small class="error" id="patterns-name-error">Entre 3 i 20 lletres o espais, sense números ni símbols.</small></div><button type="submit">Comprova els camps</button></form>
