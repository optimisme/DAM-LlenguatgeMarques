<form class="ex-form-contact" aria-labelledby="contact-title">
  <h2 id="contact-title">Parlem del teu projecte</h2>
  <label for="contact-name">Nom</label>
  <input id="contact-name" name="nom" autocomplete="name" placeholder="El teu nom">
  <label for="contact-email">Correu electrònic</label>
  <input id="contact-email" name="correu" type="email" autocomplete="email" placeholder="nom@exemple.cat">
  <label for="contact-message">Missatge</label>
  <textarea id="contact-message" name="missatge" rows="3" placeholder="Què t’agradaria crear?"></textarea>
  <button type="button">Enviar missatge</button>
</form>
